name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check munshi tests
      - name: Test
        run: pytest -q
      - name: Evaluation reproduces the committed numbers
        # The batch is deterministic, so a drift here means a behaviour change
        # landed without the reported figures being updated.
        run: |
          python -m munshi.evaluation.harness \
            --arms baseline,agent-heuristic,agent-heuristic-approved --out /tmp/eval
          python - <<'PY'
          import json
          new = json.load(open("/tmp/eval/results.json"))["arms"]
          old = json.load(open("evaluation/results.json"))["arms"]
          for arm in old:
              a, b = old[arm]["money"]["recovered_paise"], new[arm]["money"]["recovered_paise"]
              assert a == b, f"{arm}: committed {a} but reproduced {b}"
          print("evaluation reproduces exactly")
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
